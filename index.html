<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ぶっ壊せ！ユンボ</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1a1a2e;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#fff}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;touch-action:none}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:none}
#top{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:calc(env(safe-area-inset-left) + 10px);right:calc(env(safe-area-inset-right) + 10px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,.7)}
#score{font-size:24px;font-weight:900;letter-spacing:.02em;line-height:1}
#sub{font-size:12px;opacity:.9;margin-top:3px}
#btns{display:flex;gap:8px;pointer-events:auto}
.tb{width:42px;height:42px;border-radius:12px;border:none;background:rgba(0,0,0,.45);color:#fff;font-size:20px}
#ctrl{position:fixed;left:calc(env(safe-area-inset-left) + 12px);right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.lr{display:flex;gap:12px}
.cb{pointer-events:auto;width:66px;height:66px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(20,20,20,.45);color:#fff;font-size:24px;font-weight:900}
.cb.big{width:82px;height:82px;font-size:17px;background:rgba(245,179,1,.55);border-color:rgba(255,235,150,.8)}
.cb.on{background:rgba(255,255,255,.35)}
#timer{font-size:30px;line-height:42px;min-width:68px;text-align:right;font-weight:900;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
#timer.hurry{color:#ff5d6c;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.ov{position:fixed;inset:0;background:rgba(10,10,25,.88);display:none;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 24px);box-sizing:border-box;gap:14px;overflow-y:auto;touch-action:pan-y}
.ov.show{display:flex}
.ov h1{margin:6vh 0 0;font-size:clamp(34px,10vw,56px);color:#ffd166;text-shadow:0 4px 0 #b35c00,0 8px 20px rgba(0,0,0,.6);line-height:1.1}
.ov h2{margin:0;font-size:22px}
.ov p{margin:0;font-size:14px;line-height:1.8;opacity:.95}
.bigbtn{font-size:22px;font-weight:900;padding:14px 46px;border-radius:40px;border:none;background:#f5b301;color:#222;box-shadow:0 6px 0 #a87800}
.sub{font-size:16px;font-weight:800;padding:11px 28px;border-radius:30px;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff}
.best{font-size:14px;opacity:.85}
.res{font-size:clamp(36px,11vw,58px);font-weight:900;color:#ffd166;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:520px}
.chip{font-size:13px;font-weight:800;padding:5px 10px;border-radius:20px;background:#333;position:relative}
.chip b{font-size:10px;margin-right:4px}
.new{position:absolute;top:-8px;right:-6px;font-size:9px;background:#ff3d6b;color:#fff;border-radius:6px;padding:1px 4px}
.sec{width:100%;max-width:520px;text-align:left}
.sec h3{margin:10px 0 6px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.card{border-radius:10px;padding:10px 6px;background:#262636;border:2px solid #444;font-size:14px;font-weight:800;text-align:center;min-height:42px;display:flex;flex-direction:column;justify-content:center}
.card small{font-size:10px;opacity:.75;font-weight:600;margin-top:2px}
.card.no{color:#666;border-style:dashed}
.brand{margin-top:8px;width:100%;max-width:360px;background:#fff;border-radius:14px;padding:14px 16px 12px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px}
.share{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:360px}
.srow{display:flex;gap:8px;width:100%}
.sbtn{flex:1;font-size:14px;font-weight:800;padding:11px 6px;border-radius:12px;border:none;color:#fff;text-decoration:none;text-align:center;font-family:inherit}
.sbtn.x{background:#000;border:1px solid #555}.sbtn.line{background:#06c755}.sbtn.cp{background:#444}
.tbrand{margin-top:10px;max-width:280px;padding:10px 14px}
.brand{align-items:flex-start!important;text-align:left}
.pby{font-size:11px;letter-spacing:.15em;color:#667;font-weight:700}
.pname{font-size:14px;font-weight:800;color:#10264a;margin-top:-4px}
.brand img{width:100%;height:auto;display:block}
.brand a{font-size:14px;font-weight:800;color:#fff;text-decoration:none;background:linear-gradient(90deg,#f58529,#dd2a7b,#8134af);padding:9px 14px;border-radius:22px;word-break:break-all}
.bar{width:100%;max-width:520px;height:10px;border-radius:6px;background:#333;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,#ffd166,#ff5d8f)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div><div id="score">0円</div><div id="sub">ビル 0棟</div></div>
  <div id="btns"><div id="timer">60.0</div><button class="tb" id="mute">🔊</button></div>
</div>

<div id="ctrl">
  <div class="lr"><button class="cb" id="bL">◀</button><button class="cb" id="bR">▶</button></div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px"><button class="cb big" id="bS">伸ばす</button></div>
</div>

<div class="ov show" id="title">
  <h1>ぶっ壊せ！<br>ユンボ</h1>
  <div class="best" id="bestT"></div>
  <p>60秒でどれだけ被害を出せるか勝負。<br>ムカつく言葉のビルを壊すとボーナス、<br>レアなビルほど高得点で図鑑に載る。</p>
  <p style="font-size:12px;opacity:.75">なぞる→アーム操作／遠くをタッチ→自動走行<br>鉄球を地面に叩きつけ→衝撃波／「伸ばす」で鎖が伸びる</p>
  <button class="bigbtn" id="go">スタート</button>
  <button class="sub" id="zukanBtn">ビル図鑑</button>
  <div class="brand tbrand"><div class="pby">Produced by</div><img id="titleLogo" alt="彩重機エンジニアリング"></div>
</div>

function makeBuilding(x,kind,label){
  let w,h;
  if(kind==='car'){w=5;h=2}else if(kind==='house'){w=ri(6,8);h=ri(5,6)}else if(kind==='tower'){w=ri(4,5);h=ri(14,18)}else{w=ri(6,9);h=ri(9,13)}
  const wall=kind==='house'?pick(['#b5543c','#c46a4a','#d8c3a5','#e8d8b8','#a4483a']):kind==='tower'?pick(['#5d7690','#6b7f99','#4a5e78']):kind==='car'?pick(['#d62828','#1d4ed8','#eeeeee','#16a34a','#2a3346','#f59e0b']):pick(['#9aa3ad','#b8b0a2','#7f8c99','#c9c2b6','#8e9aa6']);
  const roof=kind==='house'?pick(['#3b3b4f','#6b2e2e','#2f4f4f','#4b3b2b']):'#555b63';
  const colors={1:wall,2:wall,3:'#8fd3ff',4:roof,5:'#7a4b2a',6:wall,7:'#1c1c1c'};
  const n=w*h,t=new Uint8Array(n),hp=new Float32Array(n),col=new Array(n);let cnt=0;
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){
    let ty=0;
    if(kind==='car'){ if(r===0) ty=(c===1||c===3)?7:6; else ty=(c===1||c===2)?3:(c===3?6:0); }
    else if(kind==='house'){ if(r===h-1) ty=(c>=1&&c<=w-2)?4:0; else if(r===h-2) ty=4; else if(c===1&&r<=1) ty=5; else if(r===2&&c>=3&&c<w-1&&c%2===1) ty=3; else ty=2; }
    else if(kind==='tower'){ if(r===h-1) ty=4; else if(r>=1&&c>=1&&c<w-1&&r%2===1) ty=3; else ty=1; }
    else { if(r===h-1) ty=4; else if(r>=1&&c>=1&&c<w-1&&r%3!==0&&c%2===1) ty=3; else ty=1; }
    const i=r*w+c;t[i]=ty;
    if(ty){hp[i]=HP[ty];col[i]=shade(colors[ty],0.86+Math.random()*0.22);cnt++;}
  }
  return {x,w,h,t,hp,col,label,kind,init:cnt,count:cnt,dirty:false,dead:false,top:h,cs:C};

let AC=null,master,bus,verb,engOsc,engOsc2,engFilt,engGain,noiseBuf,brownBuf,distCurve,whooshG,whooshF,muted=false,lastCollapse=0;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const sr=AC.sampleRate;
    master=AC.createGain();master.gain.value=0.9;
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=8;comp.ratio.value=6;comp.attack.value=0.003;comp.release.value=0.25;
    const low=AC.createBiquadFilter();low.type='lowshelf';low.frequency.value=120;low.gain.value=7;
    bus=AC.createGain();bus.connect(low).connect(comp).connect(master).connect(AC.destination);
    // reverb
    verb=AC.createConvolver();const L=sr*2.2,ir=AC.createBuffer(2,L,sr);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let k=0;k<L;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/L,3.2);}
    verb.buffer=ir;const vg=AC.createGain();vg.gain.value=0.5;verb.connect(vg).connect(bus);
    noiseBuf=AC.createBuffer(1,sr*2,sr);{const d=noiseBuf.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1;}
    brownBuf=AC.createBuffer(1,sr*3,sr);{const d=brownBuf.getChannelData(0);let last=0;for(let k=0;k<d.length;k++){last=(last+0.02*(Math.random()*2-1))/1.02;d[k]=last*3.5;}}
    distCurve=new Float32Array(1024);for(let k=0;k<1024;k++){const x=k/512-1;distCurve[k]=Math.tanh(x*4);}
    // diesel engine
    engOsc=AC.createOscillator();engOsc.type='sawtooth';engOsc.frequency.value=34;
    engOsc2=AC.createOscillator();engOsc2.type='square';engOsc2.frequency.value=17;
    engFilt=AC.createBiquadFilter();engFilt.type='lowpass';engFilt.frequency.value=180;engFilt.Q.value=3;
    engGain=AC.createGain();engGain.gain.value=0.07;
    const lfo=AC.createOscillator();lfo.frequency.value=11;const lg=AC.createGain();lg.gain.value=0.03;lfo.connect(lg).connect(engGain.gain);lfo.start();
    const g2=AC.createGain();g2.gain.value=0.5;engOsc2.connect(g2).connect(engFilt);
    engOsc.connect(engFilt).connect(engGain).connect(bus);engOsc.start();engOsc2.start();
    // chain whoosh (continuous)
    const ws=AC.createBufferSource();ws.buffer=noiseBuf;ws.loop=true;

}
function burst({buf,type='lowpass',freq=800,Q=0.7,dur=0.3,vol=0.5,att=0.003,dist=false,wet=0,delay=0}){
  if(!AC||muted)return;const t=AC.currentTime+delay;

  const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=Q;
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  let n=s.connect(f);if(dist){const w=AC.createWaveShaper();w.curve=distCurve;n=n.connect(w);}
  n.connect(g);g.connect(bus);if(wet){const wg=AC.createGain();wg.gain.value=wet;g.connect(wg).connect(verb);}
  s.start(t,Math.random()*((s.buffer.duration-dur-0.1)>0?(s.buffer.duration-dur-0.1):0));s.stop(t+dur+0.05);
}
function thump(vol,f0=110,f1=30,dur=0.45,delay=0,wet=0.2){
  if(!AC||muted)return;const t=AC.currentTime+delay;
  const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.005);g.gain.exponentialRampToValueAtTime(0.001,t+dur);

function tone(f0,f1,dur,vol,type='sine',delay=0){

function shockwave(x,power){

  const R=80+power*6;
  rings.push({x,y:-4,r:10,life:24,max:24});
  for(const b of buildings){
    if(b.count<=0||b.x>x+R||b.x+b.w*b.cs<x-R)continue;

  const px=ex.x+ex.f*22,py=-84;
  const e={x:px+ex.f*L1*Math.cos(ex.a1),y:py+L1*Math.sin(ex.a1)};
  const t={x:e.x+ex.f*L2*Math.cos(ex.a2),y:e.y+L2*Math.sin(ex.a2)};

function update(dt){

  // facing
  if((target.x-ex.x)*ex.f<-60)ex.f*=-1;

  const px=ex.x+ex.f*22,rawLx=(target.x-px)*ex.f;

  if(!prevS)prevS=S.map(s=>({x:s.x,y:s.y}));
  S.forEach((s,k)=>{s.vx=(s.x-prevS[k].x)/dt;s.vy=(s.y-prevS[k].y)/dt;s.sp=Math.hypot(s.vx,s.vy);prevS[k]={x:s.x,y:s.y};});

    const R=(curl||keyS)?175:105;
    const vx=(ball.x-ball.px)*0.994,vy=(ball.y-ball.py)*0.994;
    ball.px=ball.x;ball.py=ball.y;ball.x+=vx;ball.y+=vy+0.55*dt*dt;
    const dx=ball.x-J.t.x,dy=ball.y-J.t.y,d=Math.hypot(dx,dy);

  for(const b of buildings){

      const c0=Math.max(0,Math.floor((ex.x-74-b.x)/b.cs)),c1=Math.min(b.w-1,Math.floor((ex.x+74-b.x)/b.cs));
      for(let r=0;r<Math.min(2,b.h);r++)for(let c=c0;c<=c1;c++){

  for(const b of buildings)if(b.dirty)settle(b);

  if(mode==='bucket'&&J.bc.y+24>0&&S[3].sp>2&&Math.random()<0.5)addDust(J.bc.x,-4,1);

const SKY=[];{let x=0;while(x<1800){const w=rand(40,110),h=rand(80,260);SKY.push({x,w,h});x+=w+rand(4,30);}}

      if(b.kind!=='word'&&b.hp[i]<HP[ty]*0.6){ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x+3,y+4);ctx.lineTo(x+b.cs/2,y+b.cs/2);ctx.lineTo(x+b.cs-4,y+b.cs-3);ctx.stroke();}
    }
    if(b.kind==='word'&&!b.dead&&b.top>0){
      const R=RAR[b.rk],cx=b.x+b.w*b.cs/2,ty=-b.top*b.cs-8;
      if(!b.seen&&b.x<vr-60&&b.x+b.w*b.cs>vl+60){b.seen=true;if(b.rk>=3&&state==='play'){addText(cx,ty-50,R.k+' 出現！',R.tag,30);tone(660,1320,0.3,0.15,'triangle');}}
      const pul=b.rk>=3?1+Math.sin(performance.now()/150)*0.08:1;
      ctx.save();ctx.translate(cx,ty-12);ctx.scale(pul,pul);
      ctx.font='900 15px system-ui,sans-serif';const tw=ctx.measureText(R.k).width+16;
      ctx.fillStyle=R.frame==='rainbow'?`hsl(${(performance.now()/5)%360},90%,55%)`:R.tag;rr(-tw/2,-11,tw,22,11);ctx.fill();
      ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(R.k,0,1);ctx.restore();
    }
    if(b.label&&b.kind!=='word'&&!b.dead&&b.top>0){
      const cx=b.x+b.w*b.cs/2,ty=-b.top*b.cs;
      ctx.font='bold 16px system-ui,sans-serif';
      const tw=ctx.measureText(b.label).width+18;
      ctx.fillStyle='#555';ctx.fillRect(cx-tw/2+8,ty-14,3,14);ctx.fillRect(cx+tw/2-11,ty-14,3,14);
      ctx.fillStyle='#fff';ctx.fillRect(cx-tw/2,ty-40,tw,27);
      ctx.strokeStyle='#d62828';ctx.lineWidth=3;ctx.strokeRect(cx-tw/2,ty-40,tw,27);
      ctx.fillStyle='#111';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.label,cx,ty-26);
    }
  }
  // debris
  for(const p of debris){
    if(p.x<vl||p.x>vr)continue;
    const cs=Math.cos(p.a),sn=Math.sin(p.a);
    ctx.globalAlpha=p.life<60?p.life/60:1;
    ctx.setTransform(k*cs,k*sn,-k*sn,k*cs,ox+k*p.x,oy+k*p.y);
    ctx.fillStyle=p.col;ctx.fillRect(-p.s/2,-p.s*0.4,p.s,p.s*0.8);
  }
  ctx.globalAlpha=1;ctx.setTransform(k,0,0,k,ox,oy);
  for(const g of rings){ctx.globalAlpha=g.life/g.max;ctx.strokeStyle='#fff6d0';ctx.lineWidth=6*g.life/g.max+1;ctx.beginPath();ctx.ellipse(g.x,g.y,g.r,g.r*0.45,0,0,7);ctx.stroke();}
  ctx.globalAlpha=1;
  drawEx();
  for(const b of buildings){
    if(b.count<=0||b.x>vr||b.x+b.w*b.cs<vl)continue;
    if(b.kind==='word'){
      const cs=b.cs;ctx.save();ctx.beginPath();
      for(let i=0;i<b.t.length;i++){const ty=b.t[i];if(ty!==8&&ty!==9)continue;ctx.rect(b.x+(i%b.w)*cs,-(((i/b.w)|0)+1)*cs,cs+0.6,cs+0.6);}
      ctx.clip();
      ctx.font=b.font;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=b.ink;ctx.lineJoin='round';ctx.lineWidth=10;ctx.strokeStyle=b.bgc;
      const top=-(b.F+b.T)*cs;b.lines.forEach((l,k)=>{ctx.strokeText(l,b.x+b.w*cs/2,top+b.ty0+k*b.LH);ctx.fillText(l,b.x+b.w*cs/2,top+b.ty0+k*b.LH);});
      ctx.restore();
    }
  }
  for(const d of dust){ctx.globalAlpha=Math.max(0,d.life/d.max)*0.5;ctx.fillStyle='#c9b591';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const t of texts){
    ctx.globalAlpha=Math.min(1,t.life/30);ctx.font=`900 ${t.size}px system-ui,sans-serif`;
    ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.75)';ctx.strokeText(t.s,t.x,t.y);ctx.fillStyle=t.color;ctx.fillText(t.s,t.x,t.y);
  }
  ctx.globalAlpha=1;
  // screen overlays
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.textAlign='center';ctx.textBaseline='middle';
  if(combo>=10){
    const s=Math.min(1.6,1+combo/200);ctx.font=`900 ${22*s}px system-ui,sans-serif`;
    ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.7)';const y=Math.min(H*0.24,GY-200)+10;
    ctx.strokeText(`${combo} COMBO`,W/2,y);ctx.fillStyle=combo>=100?'#ff5d8f':'#ffd166';ctx.fillText(`${combo} COMBO`,W/2,y);
  }
  if(flash>0.01){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H);flash*=0.86;}
  if(bigMsg){
    const a=Math.min(1,bigMsg.life/30),sc=1+Math.max(0,(bigMsg.life-130)/20)*0.5;
    ctx.globalAlpha=a;ctx.font=`900 ${Math.min(34,W/13)*sc}px system-ui,sans-serif`;
    ctx.lineWidth=7;ctx.strokeStyle='#7a2e00';ctx.strokeText(bigMsg.s,W/2,H*0.38);ctx.fillStyle='#fff3b0';ctx.fillText(bigMsg.s,W/2,H*0.38);ctx.globalAlpha=1;
  }
}
function drawEx(){
  const x=ex.x,f=ex.f,J=joints();
  // tracks
  ctx.fillStyle='#262626';rr(x-74,-34,148,34,16);ctx.fill();
  ctx.fillStyle='#3d3d3d';rr(x-67,-29,134,24,12);ctx.fill();
  for(const o of [-50,-25,0,25,50]){ctx.fillStyle='#5a5a5a';ctx.beginPath();ctx.arc(x+o,-17,9,0,7);ctx.fill();ctx.fillStyle='#9a9a9a';ctx.beginPath();ctx.arc(x+o,-17,3,0,7);ctx.fill();}
  ctx.fillStyle='#111';const ph=((ex.phase%14)+14)%14;
  for(let s=-66+ph;s<66;s+=14){ctx.fillRect(x+s,-34,4,4);ctx.fillRect(x-s,-4,4,4);}
  // upper body
  ctx.save();ctx.translate(x,-36);ctx.scale(f,1);
  ctx.fillStyle='#333';ctx.fillRect(-32,-4,64,8);
  ctx.fillStyle='#d9a000';rr(-84,-46,42,42,10);ctx.fill();
  ctx.fillStyle='#f5b301';rr(-62,-48,114,44,6);ctx.fill();
  ctx.fillStyle='#222';for(let i=0;i<4;i++)ctx.fillRect(-52+i*9,-40,5,14);
  ctx.fillStyle='#444';ctx.fillRect(-40,-66,6,20);
  ctx.fillStyle='#f5b301';rr(4,-108,46,64,6);ctx.fill();
  ctx.fillStyle='#9ad1ec';rr(10,-102,34,42,4);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(16,-96);ctx.lineTo(24,-80);ctx.stroke();
  ctx.fillStyle='#222';ctx.fillRect(-84,-14,42,4);
  ctx.restore();
  const p=J.p,e=J.e,t=J.t;
  const dx=e.x-p.x,dy=e.y-p.y,len=Math.hypot(dx,dy),nx=f*dy/len,ny=f*-dx/len;
  const cp={x:(p.x+e.x)/2+nx*30,y:(p.y+e.y)/2+ny*30};
  // boom cylinder
  const cb={x:x+f*42,y:-58},ce={x:p.x+dx*0.45+nx*14,y:p.y+dy*0.45+ny*14};
  ctx.lineCap='round';
  ctx.strokeStyle='#3a3a3a';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(cb.x,cb.y);ctx.lineTo(ce.x,ce.y);ctx.stroke();
  ctx.strokeStyle='#d8d8d8';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cb.x+(ce.x-cb.x)*0.45,cb.y+(ce.y-cb.y)*0.45);ctx.lineTo(ce.x,ce.y);ctx.stroke();
  // boom
  ctx.strokeStyle='#3a2c00';ctx.lineWidth=25;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo(cp.x,cp.y,e.x,e.y);ctx.stroke();
  ctx.strokeStyle='#f5b301';ctx.lineWidth=19;ctx.stroke();
  // arm cylinder
  const ac0={x:p.x+dx*0.62+nx*30,y:p.y+dy*0.62+ny*30},adx=t.x-e.x,ady=t.y-e.y;
  const ac1={x:e.x-adx*0.18+nx*8,y:e.y-ady*0.18+ny*8};
  ctx.strokeStyle='#3a3a3a';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(ac0.x,ac0.y);ctx.lineTo(ac1.x,ac1.y);ctx.stroke();
  ctx.strokeStyle='#d8d8d8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo((ac0.x+ac1.x)/2,(ac0.y+ac1.y)/2);ctx.lineTo(ac1.x,ac1.y);ctx.stroke();
  // arm
  ctx.strokeStyle='#3a2c00';ctx.lineWidth=19;ctx.beginPath();ctx.moveTo(e.x-adx*0.2,e.y-ady*0.2);ctx.lineTo(t.x,t.y);ctx.stroke();
  ctx.strokeStyle='#f5b301';ctx.lineWidth=14;ctx.stroke();
  for(const q of [p,e,t]){ctx.fillStyle='#222';ctx.beginPath();ctx.arc(q.x,q.y,5.5,0,7);ctx.fill();}
  if(mode==='ball'){
    ctx.strokeStyle='#2a2a2a';ctx.lineWidth=4;ctx.setLineDash([7,4]);ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(ball.x,ball.y);ctx.stroke();ctx.setLineDash([]);
    const gr=ctx.createRadialGradient(ball.x-9,ball.y-9,4,ball.x,ball.y,BR);gr.addColorStop(0,'#8a8a8a');gr.addColorStop(1,'#1e1e1e');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(ball.x,ball.y,BR,0,7);ctx.fill();
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(t.x,t.y,7,0,7);ctx.fill();
    return;
  }
  // bucket
  ctx.save();ctx.translate(t.x,t.y);ctx.scale(f,1);ctx.rotate(ex.a2+ex.br);
  ctx.fillStyle='#3b3b3b';ctx.strokeStyle='#1a1a1a';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-8,-10);ctx.lineTo(12,-16);ctx.quadraticCurveTo(34,-8,38,16);ctx.lineTo(30,34);ctx.lineTo(8,28);ctx.quadraticCurveTo(-4,18,-8,-10);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#bdbdbd';
  for(const q of [[28,33],[20,31],[12,29]]){ctx.beginPath();ctx.moveTo(q[0]-4,q[1]-1);ctx.lineTo(q[0]+4,q[1]+1);ctx.lineTo(q[0]-1,q[1]+9);ctx.closePath();ctx.fill();}
  ctx.restore();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(t.x,t.y,5.5,0,7);ctx.fill();
}

// ---------- loop ----------
const scoreEl=document.getElementById('score'),subEl=document.getElementById('sub'),timerEl=document.getElementById('timer');
let last=performance.now(),shown=-1;
function loop(now){
  const raw=Math.max(0.2,Math.min(2.5,(now-last)/16.667));last=now;const dt=raw;
  update(dt);draw();
  if(shown!==score+roundBoards.length){shown=score+roundBoards.length;scoreEl.textContent=yen(score);subEl.textContent=`ビル ${roundBoards.length}棟`;}
  const tt=Math.max(0,timeLeft).toFixed(1);if(timerEl.textContent!==tt)timerEl.textContent=tt;
  const hurry=state==='play'&&timeLeft<=10;if(timerEl.classList.contains('hurry')!==hurry)timerEl.classList.toggle('hurry',hurry);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
